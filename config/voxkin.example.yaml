llm:
  provider: openai_compat
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.7
  max_tokens: 512
  timeout_s: 60
  stream: true

tts:
  engine: "gpt_sovits"
  character: "Theresa"
  base_url: "http://127.0.0.1:9880"
  reference_audio: "models/reference/xiaote.wav"
  reference_text: "阿米娅看上去还是这么瘦弱，这个年纪的孩子，个子是不是应该更高一点才对？她到底有没有好好吃饭呢。"
  text_lang: "zh"
  prompt_lang: "zh"
  language: "zh"
  sample_rate: 32000
  max_chars_per_request: 30
  timeout_s: 120
  manage_service: false
  start_command: []
  working_dir: ""
  health_url: "http://127.0.0.1:9880/openapi.json"

stt:
  engine: "faster_whisper"
  model: "small"
  device: "cpu"
  compute_type: "int8"
  language: "zh"
  beam_size: 1
  vad_threshold: 0.5
  vad_min_speech_ms: 320
  vad_min_silence_ms: 640
  sample_rate: 16000
  max_utterance_s: 20
  to_simplified: true

audio:
  output: "speaker"
  device: ""
  volume: 1.0
  minecraft_audio_dir: ""
  wav_dir: "data/audio_out"
  segment_lead_s: 0.05

server:
  host: "127.0.0.1"
  port: 8765

persona:
  name: "DeepSeek-chan"
  system_prompt: |
    你是沃心，一个生活在 Minecraft 世界里的伙伴。说话简短自然，像一个熟悉的朋友。
    你只描述已经发生或正在发生的事，没有执行完的动作不要声称完成。
    你的回复会被直接朗读，因此不要输出代码块、列表符号或表情符号。
  max_history_turns: 12

memory:
  enabled: true
  db_path: "data/voxkin.db"
  session_id: "minecraft"
  summarize_threshold: 8
  summary_max_chars: 200
  retrieve_limit: 5
  recent_turns: 8
  context_token_budget: 900
